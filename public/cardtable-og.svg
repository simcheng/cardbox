<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Cardtable</title>
  <desc id="desc">A felt tabletop with a small fan of playing cards.</desc>
  <defs>
    <linearGradient id="felt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d4b38"/><stop offset="1" stop-color="#082d23"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#031a12" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1200" height="630" rx="32" fill="url(#felt)"/>
  <path d="M0 100h1200M0 530h1200M180 0v630M1020 0v630" stroke="#91b89a" stroke-opacity=".08" stroke-width="2"/>
  <g filter="url(#shadow)" transform="translate(475 112)">
    <g transform="rotate(-13 120 205)"><rect width="250" height="350" rx="18" fill="#f8f5e9"/><text x="28" y="58" font-family="sans-serif" font-size="38" font-weight="800" fill="#bd4f4c">Q</text><text x="30" y="96" font-family="serif" font-size="34" fill="#bd4f4c">♥</text><text x="125" y="220" text-anchor="middle" font-family="serif" font-size="130" fill="#bd4f4c">♥</text></g>
    <g transform="rotate(1 120 205)"><rect width="250" height="350" rx="18" fill="#f8f5e9"/><text x="28" y="58" font-family="sans-serif" font-size="38" font-weight="800" fill="#263d32">A</text><text x="30" y="96" font-family="serif" font-size="34" fill="#263d32">♣</text><text x="125" y="220" text-anchor="middle" font-family="serif" font-size="130" fill="#263d32">♣</text></g>
    <g transform="rotate(14 120 205)"><rect width="250" height="350" rx="18" fill="#f8f5e9"/><text x="28" y="58" font-family="sans-serif" font-size="38" font-weight="800" fill="#bd4f4c">7</text><text x="30" y="96" font-family="serif" font-size="34" fill="#bd4f4c">♦</text><text x="125" y="220" text-anchor="middle" font-family="serif" font-size="130" fill="#bd4f4c">♦</text></g>
  </g>
  <text x="600" y="565" text-anchor="middle" font-family="sans-serif" font-size="54" font-weight="800" letter-spacing="4" fill="#f1e7bb">CARDTABLE</text>
  <text x="600" y="600" text-anchor="middle" font-family="sans-serif" font-size="18" letter-spacing="3" fill="#b8d0bb">PLAY YOUR WAY</text>
